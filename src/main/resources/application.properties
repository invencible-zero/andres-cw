spring.application.name=andres-cw

# In-memory H2 database. DB_CLOSE_DELAY=-1 keeps it alive for the lifetime of the JVM
# (not just while a connection is open); DB_CLOSE_ON_EXIT=FALSE lets Spring close it on shutdown.
spring.datasource.url=jdbc:h2:mem:andres_cw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# H2 web console: http://localhost:8080/h2-console
# JDBC URL jdbc:h2:mem:andres_cw, user "sa", empty password. Local access only (web-allow-others=false);
# do not enable it in a deployed environment.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Liquibase owns the schema; it runs on startup, before any bean that uses the DataSource.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Fan-out worker (Part 2). Off by default: iteration 1 has no production adapters, so the engine is only wired
# in the "demo" profile below. The defaults of every fanout.* knob are sized for the real ~1 minute load and
# live in FanOutProperties.

#---
# Profile "demo": plays one publish against a simulated world and exits.
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=demo"
spring.config.activate.on-profile=demo

fanout.enabled=true

spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.invencible.labs.cw.fanout=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %msg%n

# The real downstream takes ~60 s per load; here a load takes 400 ms (time compressed ~150x), so every
# duration below is the production value divided by roughly that. maxConcurrency (40) is deliberately above
# the simulated downstream's capacity (16): the AIMD limiter has to discover the difference by itself.
fanout.max-concurrency=40
fanout.initial-concurrency=4
fanout.min-concurrency=1
fanout.throttle-ratio=0.5
fanout.timeout-ratio=0.9
fanout.decrease-cooldown=1s
fanout.start-rate-per-second=70
fanout.start-burst=10
fanout.max-in-flight-per-firm=12

fanout.call-timeout=1s
fanout.lease=6s
fanout.shutdown-grace=2s

fanout.max-attempts=5
fanout.retry-base=300ms
fanout.retry-cap=3s
fanout.breaker-failure-threshold=5
fanout.breaker-open-for=500ms
fanout.breaker-max-open-for=1600ms

fanout.shards=8
fanout.scan-batch-size=500
fanout.tick=20ms

# The simulated world: a skewed set of firms and a downstream with capacity 16 that sometimes misbehaves.
fanout.demo.giant-firm-files=800
fanout.demo.medium-firms=5
fanout.demo.medium-firm-files=50
fanout.demo.small-firms=50
fanout.demo.small-firm-files=6
fanout.demo.downstream-capacity=16
fanout.demo.timeout-rate=0.01
fanout.demo.unavailable-rate=0.01
fanout.demo.outage-after=5s
fanout.demo.outage-for=2s
