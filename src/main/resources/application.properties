spring.application.name=andres-cw

# In-memory H2 database. DB_CLOSE_DELAY=-1 keeps it alive for the lifetime of the JVM
# (not just while a connection is open); DB_CLOSE_ON_EXIT=FALSE lets Spring close it on shutdown.
spring.datasource.url=jdbc:h2:mem:andres_cw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# H2 web console: http://localhost:8080/h2-console
# JDBC URL jdbc:h2:mem:andres_cw, user "sa", empty password. Local access only (web-allow-others=false);
# do not enable it in a deployed environment.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Liquibase owns the schema; it runs on startup, before any bean that uses the DataSource.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
